<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Kerit Panel</title>
<link rel="icon" href="/favicon.svg" />
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0a0f0d;
    color: #e7f2ec;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: #0a0f0d;
    border: 2px solid #212e28;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p {
    color: #8ea095;
    font-size: 0.95rem;
    max-width: 320px;
    line-height: 1.5;
    margin: 0 0 20px;
  }
  button {
    background: #5eff9a;
    color: #0a0f0d;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { background: #7dffb0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
        <path d="M17 22L27 32L17 42" stroke="#5eff9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M33 42H47" stroke="#5eff9a" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Kerit Panel needs a live connection to manage your servers. Reconnect and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
