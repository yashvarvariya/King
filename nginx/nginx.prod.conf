# ---------------------------------------------------------------------------
# Production Nginx config: HTTPS termination + reverse proxy + hardening.
#
# Prerequisites:
#   - A domain name pointed at this host.
#   - TLS certificates present at the paths below. If you're using
#     Let's Encrypt/Certbot (recommended — see DEPLOYMENT.md), the webroot
#     challenge path is already wired up on port 80.
#   - Set $SERVER_NAME via envsubst or replace "example.com" below.
# ---------------------------------------------------------------------------

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;                 # don't leak nginx version
  client_max_body_size 512m;         # allow large ZIP uploads

  # ---- Logging ----
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ---- Gzip compression ----
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml+rss
    application/rss+xml application/atom+xml image/svg+xml
    font/ttf font/otf font/woff font/woff2;

  # ---- Brotli compression (requires nginx built/packaged with ngx_brotli;
  #      the alpine image used in docker-compose.prod.yml includes it via
  #      the `fholzer/nginx-brotli` style module, or fall back to plain
  #      nginx:1.27-alpine, in which case these two directives are simply
  #      ignored — remove them if your nginx build errors on unknown
  #      directives.) ----
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types text/plain text/css application/json application/javascript
  #   text/xml application/xml image/svg+xml;

  # ---- Rate limiting zones (defense-in-depth in front of the Nest
  #      throttler; auth endpoints get a stricter zone) ----
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  upstream frontend { server web:3000; keepalive 32; }
  upstream backend  { server api:4000; keepalive 32; }

  # ---- Cloudflare real-IP restoration ----
  # If you put Cloudflare in front of this panel (orange-cloud proxy),
  # every request nginx sees arrives FROM a Cloudflare edge IP, not the
  # actual visitor — without this block, $remote_addr, the rate-limit
  # zones above (keyed on $binary_remote_addr), and access logs would all
  # see Cloudflare's IPs instead of real ones. These directives only take
  # effect for connections actually originating from Cloudflare's ranges,
  # so they're inert/harmless if you aren't using Cloudflare.
  # List current as of Cloudflare's published ranges — refresh periodically
  # from https://www.cloudflare.com/ips/ (ranges rarely change).
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # =========================================================================
  # HTTP (port 80): ACME challenge + redirect everything else to HTTPS
  # =========================================================================
  server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME};

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # =========================================================================
  # HTTPS (port 443)
  # =========================================================================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${SERVER_NAME}/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self'" always;

    # ---- Next.js panel ----
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      limit_req zone=general burst=40 nodelay;
    }

    # ---- Next.js static assets: long-lived, immutable cache ----
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # ---- Favicon / public assets: cache but allow revalidation ----
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=86400";
      access_log off;
    }

    # ---- Auth endpoints: stricter rate limit ----
    location /api/auth/ {
      proxy_pass http://backend/auth/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      limit_req zone=auth burst=10 nodelay;
    }

    # ---- Health checks: no rate limit, no logging noise ----
    location /api/health {
      proxy_pass http://backend/health;
      proxy_set_header Host $host;
      access_log off;
    }

    # ---- REST API ----
    location /api/ {
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;         # allow large ZIP upload / long backup ops
      client_max_body_size 512m;
      limit_req zone=general burst=40 nodelay;
    }

    # ---- Branding uploads (logo/favicon) ----
    location /uploads/ {
      proxy_pass http://backend/uploads/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=3600";
    }

    # ---- Socket.IO / WebSocket console + stats stream ----
    location /socket.io/ {
      proxy_pass http://backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;        # keep long-lived console sessions open
      proxy_send_timeout 3600s;
    }
  }
}
